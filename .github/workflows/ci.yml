name: CI

on:
  push:
    branches: [main, modificaciones]
  pull_request:
    branches: [main, modificaciones]

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webApp/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: webApp/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # El lint tiene avisos preexistentes pendientes de limpiar: se
      # ejecuta y se reporta, pero de momento no bloquea la build.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Test (vitest)
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:8000

  backend-lint:
    name: Backend (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webApp/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

  backend-test:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webApp/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: webApp/backend/requirements*.txt

      # Instala torch/torchvision desde el índice CPU-only: las ruedas
      # estándar de PyPI incluyen soporte CUDA y son mucho más pesadas de
      # descargar en un runner sin GPU.
      - name: Install backend dependencies
        run: |
          pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: placeholder-service-key
          GEMINI_API_KEY: placeholder-gemini-key
        run: pytest -v
